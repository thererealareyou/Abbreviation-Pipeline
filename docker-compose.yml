services:
  database:
    image: postgres:15-alpine
    container_name: nlp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nlp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nlp_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nlp_redis
    restart: always
    command: redis-server --requirepass redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: fastapi_app
    restart: always
    command: >
      sh -c "alembic upgrade head || alembic stamp head && uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    tty: true
    environment:
      - APP_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_HEALTH_ENDPOINT=${LLM_HEALTH_ENDPOINT}
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT}
      - MAX_WORKERS=${MAX_WORKERS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  
  worker:
    build: .
    container_name: arq_worker
    restart: always
    volumes:
      - .:/app
      - /app/.venv
    command: .venv/bin/arq src.backend.tasks.public.WorkerSettings
    tty: true
    environment:
      - APP_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - LLM_API_URL=${LLM_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: